services:
  pcb-detector:
    image: yolov8-pcb-detection:v1
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/fonts:/etc/fonts:ro
      - /usr/share/fonts:/usr/share/fonts:ro
      - /usr/lib/librknnrt.so:/usr/lib64/librknnrt.so
      - ./app/results:/app/app/results
      - .:/app
    devices:
      - /dev/video0
      - /dev/ttyUSB0
      - /dev/dri
    stdin_open: true
    tty: true